services:
  - type: web
    name: sigri370-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sigri370-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Administrador SIGRI370
      - key: INITIAL_ADMIN_EMAIL
        value: admin@sigri370.com.br
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: sigri370-db
    plan: free
